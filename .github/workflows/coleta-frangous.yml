name: Coleta FrangoUS
on:
  workflow_run:
    workflows: ["Coleta BeefUS"]
    types: [completed]
  workflow_dispatch:
concurrency:
  group: coleta-planilhas
  cancel-in-progress: false
jobs:
  coleta:
    timeout-minutes: 35
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
      NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
      MARS_API_KEY: ${{ secrets.MARS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Pipeline FrangoUS
        run: python FrangoUS/atualizar_frangous_pipeline.py | tee /tmp/o.txt

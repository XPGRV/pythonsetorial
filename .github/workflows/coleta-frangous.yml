name: Coleta FrangoUS
# Sem cron: quem manda no horario e o esteira.py, no PC do Bloomberg.
# Este workflow fica disponivel so para disparo manual/depuracao -- a rodada
# diaria passa pelo "Coleta completa" (coleta-tudo.yml).

on:
  workflow_dispatch:

concurrency:
  group: coleta-planilhas
  cancel-in-progress: false
jobs:
  coleta:
    timeout-minutes: 35
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
      NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
      MARS_API_KEY: ${{ secrets.MARS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      # Sem `| tee`: o shell padrao do Actions e `bash -e` SEM pipefail,
      # entao o status do pipe seria o do tee (sempre 0) e a falha do
      # coletor passaria como sucesso. O log do job ja mostra tudo.
      - name: Pipeline FrangoUS
        run: python FrangoUS/atualizar_frangous_pipeline.py

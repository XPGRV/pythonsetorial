name: Coleta FrangoUS

# Roda os coletores do FrangoUS na nuvem, em SEQUENCIA (nunca em paralelo —
# todos gravam no mesmo FrangoUS.xlsm no Drive via service account).
# Por enquanto SO manual (workflow_dispatch) — sem agendamento ate validarmos
# e coordenarmos com a etapa Bloomberg.
#
# Ainda de fora: atualizar_frangoUS.py (consolidador, roda na maquina Windows
# junto do Bloomberg).
#
# Secrets: GOOGLE_SERVICE_ACCOUNT_EMAIL, GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY,
#          NASS_API_KEY, MARS_API_KEY

on:
  workflow_dispatch:

jobs:
  coleta:
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
      NASS_API_KEY: ${{ secrets.NASS_API_KEY }}
      MARS_API_KEY: ${{ secrets.MARS_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instala dependencias
        run: pip install -r requirements.txt

      - name: production (coluna C)
        run: python FrangoUS/atualiza_production_frangous.py

      - name: production chicks hatched (coluna G)
        run: python FrangoUS/atualiza_production_frangous_chicks_hatched.py

      - name: abates USDA (coluna H)
        run: python FrangoUS/atualiza_abates_frangous_usda.py

      - name: production rate of lay (coluna D)
        run: python FrangoUS/atualiza_production_frangous_rateolay.py

      - name: intended placements (coluna F)
        run: python FrangoUS/atualiza_intended_placements_frangous.py

      - name: usda frangous (colunas Q/R/S)
        run: python FrangoUS/atualiza_usda_frangous.py

      - name: wholesale broiler composite (coluna T)
        run: python FrangoUS/atualiza_wholesale_broiler_composite.py

      - name: national composite (aba NationalComposite)
        run: python FrangoUS/atualiza_national_composite.py

      - name: national composite price (coluna U)
        run: python FrangoUS/atualiza_national_composite_price.py

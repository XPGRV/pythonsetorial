name: Coleta BeefBR

on:
  schedule:
    - cron: '0 23 * * 1-5'
  workflow_dispatch:

concurrency:
  # Inicio da fila noturna: os demais workflows sao disparados em cadeia.
  group: coleta-planilhas
  cancel-in-progress: false

jobs:
  coleta:
    # Impede que uma fonte externa presa bloqueie toda a fila noturna.
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instala dependencias
        run: pip install -r requirements.txt
      - name: Resumo
        run: echo "## Coleta BeefBR - $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
      - name: Pipeline BeefBR
        run: python BeefBR/atualizar_beefbr_pipeline.py --cloud | tee /tmp/o.txt

name: Coleta WEG

# Roda os coletores do WEG na nuvem via pipeline: UM download e UM upload do
# "WEG - Setorial.xlsm" para as 3 etapas (antes eram 3 de cada). Roda ANTES do
# Bloomberg das 22h, que recalcula via F9 as formulas que o openpyxl deixa sem
# cache.
#
# Fontes: Comex Stat (SECEX motores/transformadores) e FRED (PPI).
#
# Secrets: GOOGLE_SERVICE_ACCOUNT_EMAIL, GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY

# Sem cron: quem manda no horario e o esteira.py, no PC do Bloomberg.
# Este workflow fica disponivel so para disparo manual/depuracao -- a rodada
# diaria passa pelo "Coleta completa" (coleta-tudo.yml).

on:
  workflow_dispatch:

concurrency:
  group: coleta-weg
  cancel-in-progress: false

jobs:
  coleta:
    # Impede que uma fonte externa presa segure o runner indefinidamente.
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instala dependencias
        run: pip install -r requirements.txt
      - name: Resumo
        run: echo "## Coleta WEG - $(date -u '+%Y-%m-%d %H:%M UTC')" >> "$GITHUB_STEP_SUMMARY"
      # Sem `| tee`: o shell padrao do Actions e `bash -e` SEM pipefail,
      # entao o status do pipe seria o do tee (sempre 0) e a falha do
      # coletor passaria como sucesso. O log do job ja mostra tudo.
      - name: Pipeline WEG
        run: python WEG/atualizar_weg_pipeline.py

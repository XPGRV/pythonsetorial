name: Coleta FrangoBR
# Sem cron: quem manda no horario e o esteira.py, no PC do Bloomberg.
# Este workflow fica disponivel so para disparo manual/depuracao -- a rodada
# diaria passa pelo "Coleta completa" (coleta-tudo.yml).

on:
  workflow_dispatch:

concurrency:
  group: coleta-planilhas
  cancel-in-progress: false
jobs:
  coleta:
    timeout-minutes: 25
    runs-on: ubuntu-latest
    env:
      GOOGLE_SERVICE_ACCOUNT_EMAIL: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_EMAIL }}
      GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Pipeline FrangoBR
        run: python FrangoBR/atualizar_frangobr_pipeline.py | tee /tmp/o.txt
